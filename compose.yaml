services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: fantasy
      POSTGRES_PASSWORD: fantasy
      POSTGRES_DB: fantasy
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - fantasy_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fantasy -d fantasy"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  fantasy_pg:
